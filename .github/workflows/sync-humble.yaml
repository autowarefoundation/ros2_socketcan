name: sync-humble

on:
  push:
    branches:
      - jazzy

permissions:
  contents: write

jobs:
  fast-forward-humble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward humble to jazzy
        run: |
          git fetch origin humble
          if ! git merge-base --is-ancestor origin/humble HEAD; then
            echo "::error::The humble branch diverged from jazzy. The sync stopped. Remove this workflow when the lineages split."
            exit 1
          fi
          git push origin HEAD:humble
